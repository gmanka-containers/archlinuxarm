on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - tag: base
            package-group: base
          - tag: base-devel
            package-group: base base-devel
    name: ${{ matrix.build.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tags
        run: |
          if [ ${{ matrix.build.tag }} = base ]; then
            echo tags='${{ matrix.build.tag }} latest' >> $GITHUB_OUTPUT
          else
            echo tags='${{ matrix.build.tag }}' >> $GITHUB_OUTPUT
          fi
      - run: |
          sudo apt update -y
          sudo apt install -y qemu-user-static
      - uses: redhat-actions/buildah-build@v2
        with:
          image: archlinuxarm
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64, linux/arm64, linux/riscv64, linux/arm/v7
          containerfiles: |
            Containerfile
          build-args: |
            PACKAGE_GROUP=${{ matrix.build.package-group }}
      - name: quay.io
        uses: redhat-actions/push-to-registry@v2
        with:
          image: archlinuxarm
          tags: ${{ steps.tags.outputs.tags }}
          registry: quay.io/gmanka
          username: gmankab
          password: ${{ secrets.QUAY_TOKEN }}
