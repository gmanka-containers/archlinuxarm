name: Build and Push

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - tag: base
            package-group: base
          - tag: base-devel
            package-group: base base-devel
    name: ${{ matrix.target.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: gmanka
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: gmankab
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: gmankab
          password: ${{ secrets.QUAY_TOKEN }}
      - name: Generate Tag List
        run: |
          echo "TAGS<<EOF" >> $GITHUB_ENV
          DATE="$(date +'%Y%m%d')"
          for REGISTRY in {"docker.io/gmanka","ghcr.io/gmanka-containers","quay.io/gmanka"}; do
              echo "${REGISTRY}/archlinuxarm:${TAG}" >> $GITHUB_ENV
              echo "${REGISTRY}/archlinuxarm:${TAG}-${DATE}.${RUN_ID}" >> $GITHUB_ENV
              if [[ "$TAG" == "base" ]]; then
                  echo "${REGISTRY}/archlinuxarm:latest" >> $GITHUB_ENV
              fi
          done
          echo "EOF" >> $GITHUB_ENV
        env:
          TAG: ${{ matrix.target.tag }}
          RUN_ID: ${{ github.run_id }}
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/riscv64
          push: true
          tags: ${{ env.TAGS }}
          build-args: |
            PACKAGE_GROUP=${{ matrix.target.package-group }}

