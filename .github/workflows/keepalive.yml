permissions:
  contents: write
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 1 * *'
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: latest
          fetch-depth: 0
      - run: |
          git fetch origin latest
          git checkout -B latest origin/latest
          git pull --ff-only
          git config user.name keepalive-bot
          git config user.email action@github.com
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git add .github/keepalive
          git commit -m "[u] keepalive"
          git push origin HEAD:latest
